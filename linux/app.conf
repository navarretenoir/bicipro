# BiciPRO (escritorio) — configuración de empaquetado Linux (herramientas/linux-pkg/empaquetar.sh)
APP_ID=io.github.navarretenoir.BiciPRO
PAQUETE=bicipro
NOMBRE="BiciPRO"
NOMBRE_ARCHIVO=BiciPRO
VERSION=$(cat "$APP/VERSION")
BIN_GUI=bicipro
RESUMEN="Tablero de ciclocomputador (versión de escritorio de BiciPRO)"
DESCRIPCION="Tablero de ciclocomputador con velocidad por GPS, ruta, mapa e historial. Versión de escritorio de BiciPRO: los sensores Bluetooth y la navegacion sin conexion son de la app Android."
DEPS_RPM="gtk4, webkitgtk6.0, geoclue2-libs"
DEPS_DEB="libgtk-4-1, libwebkitgtk-6.0-4, geoclue-2.0"
FLATPAK_EXTRA="--system-talk-name=org.freedesktop.GeoClue2"
SNAP_EXTRA=", location-observe"
compilar() {
  local pre=$1 out=$2 w; w=$(mktemp -d)
  cp -a "$APP/desktop/." "$w/"; rm -f "$w/bicipro"
  make -s -C "$w" UI_DIR="$pre/share/bicipro/web" >/dev/null; strip "$w/bicipro"; cp "$w/bicipro" "$out/"
  rm -rf "$w"
}
instalar() {
  install -Dm755 "$3/bicipro" "$1$2/bin/bicipro"
  mkdir -p "$1$2/share/bicipro"; cp -r "$APP/web" "$1$2/share/bicipro/"; rm -f "$1$2/share/bicipro/web/"*.bak*
}
appimage_entorno() { echo 'export BICIPRO_UI="$HERE/usr/share/bicipro/web"'; }
